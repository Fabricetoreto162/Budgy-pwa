<div class="app-page-scroll auth-content">
  <div class="auth-container">

    <!-- Back Button -->
    <button type="button" class="back-btn" (click)="goBack()">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path d="M15 18L9 12L15 6" stroke="#0F1B33" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <!-- Logo -->
    <div class="brand-logo">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M6 4h7a4.5 4.5 0 0 1 4.5 4.5 4.5 4.5 0 0 1-2.5 4 4.5 4.5 0 0 1 3.5 4.5A4.5 4.5 0 0 1 14 21.5H6V4z" fill="#FFFFFF"/>
          <path d="M9 7.5h4a2 2 0 1 1 0 4H9v-4zm0 6.5h4.5a2 2 0 1 1 0 4H9V14z" fill="#F5A623"/>
        </svg>
      </div>
      <span class="brand-name">Budgy</span>
    </div>

    <!-- Heading -->
    <div class="heading">
      <h1>Créer un compte ✨</h1>
      <p>Rejoignez Budgy et prenez le contrôle de vos finances</p>
    </div>

    <!-- Form -->
    <div class="form-group">
      <label class="field-label">Nom complet</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="#9AA0AC" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="12" cy="7" r="4" stroke="#9AA0AC" stroke-width="1.8"/>
        </svg>
        <input
          type="text"
          class="text-input"
          placeholder="Votre nom complet"
          [(ngModel)]="fullName"
          autocomplete="name"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="field-label">{{ 'auth.email' | translate }}</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="#9AA0AC" stroke-width="1.8"/>
          <polyline points="22,6 12,13 2,6" stroke="#9AA0AC" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input
          type="email"
          class="text-input"
          placeholder="votre@email.com"
          [(ngModel)]="email"
          autocomplete="email"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="field-label">{{ 'auth.password' | translate }}</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none">
          <rect x="3" y="11" width="18" height="11" rx="2" stroke="#9AA0AC" stroke-width="1.8"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="#9AA0AC" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <input
          [type]="showPassword ? 'text' : 'password'"
          class="text-input"
          placeholder="Au moins 6 caractères"
          [(ngModel)]="password"
          autocomplete="new-password"
        />
        <button type="button" class="eye-btn" (click)="togglePassword()">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
            <path *ngIf="!showPassword" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="#9AA0AC" stroke-width="1.8"/>
            <circle *ngIf="!showPassword" cx="12" cy="12" r="3" stroke="#9AA0AC" stroke-width="1.8"/>
            <path *ngIf="showPassword" d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="#9AA0AC" stroke-width="1.8" stroke-linecap="round"/>
            <line *ngIf="showPassword" x1="1" y1="1" x2="23" y2="23" stroke="#9AA0AC" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Error Message -->
    <div class="error-msg" *ngIf="errorMessage">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#EF4444" stroke-width="1.8"/>
        <line x1="12" y1="8" x2="12" y2="12" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="12" y1="16" x2="12.01" y2="16" stroke="#EF4444" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Primary CTA -->
    <button
      type="button"
      class="btn-primary"
      [class.loading]="loading"
      [disabled]="loading || googleLoading"
      (click)="onSubmit()"
    >
      <span *ngIf="!loading">{{ 'onboarding.signup' | translate }}</span>
      <span *ngIf="loading" class="spinner"></span>
    </button>

    <!-- Divider -->
    <div class="divider">
      <span></span>
      <p>{{ 'auth.or_continue_with' | translate }}</p>
      <span></span>
    </div>

    <!-- Google Button -->
    <button
      type="button"
      class="btn-google"
      [class.loading]="googleLoading"
      [disabled]="loading || googleLoading"
      (click)="onGoogle()"
    >
      <span *ngIf="googleLoading" class="spinner-google"></span>
      <ng-container *ngIf="!googleLoading">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continuer avec Google
      </ng-container>
    </button>

    <!-- Switch to Login -->
    <p class="switch-link">
      Déjà un compte ?
      <a routerLink="/auth/login">Se connecter</a>
    </p>

  </div>
</div>
