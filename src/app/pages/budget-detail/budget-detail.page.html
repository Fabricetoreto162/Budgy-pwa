<div class="app-page-scroll">

  <!-- FULL PAGE LOADING -->
  <app-page-loader *ngIf="loading" message="Chargement du budget..."></app-page-loader>

  <!-- BUDGET DETAIL READY -->
  <div class="budget-detail-page dashboard-ready" *ngIf="!loading && budget">

    <button class="back-btn" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </button>


    <div class="hero" [style.background]="budget.color + '18'">
      <div class="icon-circle" [style.background]="budget.color + '30'">
        <ion-icon [name]="budget.icon" [style.color]="budget.color"></ion-icon>
      </div>
      <h2>{{ budget.name }}</h2>
      <p class="amount">{{ formatFCFA(budget.spent) }} / {{ formatFCFA(budget.amount) }}</p>
      <app-progress-bar [percent]="percent" [color]="budget.color" [showLabel]="true"></app-progress-bar>
      <p class="remaining">Il vous reste {{ formatFCFA(remaining) }}</p>
    </div>

    <div class="tabs-switch">
      <button [class.active]="activeTab === 'transactions'" (click)="activeTab = 'transactions'">
        {{ 'budget_detail.transactions_tab' | translate }}
      </button>
      <button [class.active]="activeTab === 'stats'" (click)="activeTab = 'stats'">
        {{ 'budget_detail.stats_tab' | translate }}
      </button>
    </div>

    <div class="transactions-list" *ngIf="activeTab === 'transactions'">
      <app-transaction-item
        *ngFor="let t of transactions"
        [transaction]="t"
        [icon]="budget.icon"
        [color]="budget.color">
      </app-transaction-item>

      <div class="empty-tx" *ngIf="transactions.length === 0">
        <p>Aucune dépense pour l'instant</p>
      </div>
    </div>

    <div class="stats-panel" *ngIf="activeTab === 'stats'">
      <p class="placeholder">Statistiques de ce budget bientôt disponibles.</p>
    </div>

  </div>

  <!-- ACTIONS FLOTTANTES (Bouton Ajouter une dépense en haut + Bouton Supprimer le budget en bas) -->
  <div class="budget-floating-actions" *ngIf="!loading && budget">

    <!-- Formulaire d'ajout qui s'ouvre au-dessus des boutons -->
    <div class="fab-form" *ngIf="showForm && activeTab === 'transactions'">
      <ion-input placeholder="Description" [(ngModel)]="newDescription"></ion-input>
      <ion-input type="number" placeholder="Montant" [(ngModel)]="newAmount"></ion-input>
      <ion-button expand="block" color="primary" (click)="addExpense()">
        {{ 'budget_detail.add_expense' | translate }}
      </ion-button>
    </div>

    <!-- Bouton 1 (poussé en haut) : Ajouter une dépense -->
    <button
      id="btn-add-expense"
      class="fab-btn btn-add-expense"
      *ngIf="activeTab === 'transactions'"
      (click)="showForm = !showForm"
      type="button">
      <ion-icon [name]="showForm ? 'close-outline' : 'add-outline'"></ion-icon>
      <span>{{ showForm ? 'Annuler' : 'Ajouter une dépense' }}</span>
    </button>

    <!-- Bouton 2 (en bas) : Supprimer le budget -->
    <button
      id="btn-delete-budget"
      class="fab-btn btn-delete-budget"
      (click)="removeBudget()"
      type="button">
      <ion-icon name="trash-outline"></ion-icon>
      <span>Supprimer le budget</span>
    </button>

  </div>
</div>
