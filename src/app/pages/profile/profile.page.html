<div class="app-page-scroll">

  <!-- FULL PAGE LOADING -->
  <app-page-loader *ngIf="loading" message="Chargement de votre profil..."></app-page-loader>

  <!-- PROFILE READY -->
  <div class="profile-page ion-padding dashboard-ready" *ngIf="!loading && profile">

    <h2>{{ 'profile.title' | translate }}</h2>


    <div class="avatar-block">
      <div class="avatar-wrap">
        <img [src]="profile.avatar_url || 'assets/icon/utilisateur.png'" alt="avatar" />
        <button class="edit-badge">
          <ion-icon name="pencil-outline"></ion-icon>
        </button>
      </div>
      <strong>{{ profile.full_name }}</strong>
      <span class="email">{{ profile.currency ? '' : '' }}fabrice.towanou&#64;email.com</span>
    </div>

    <div class="settings-group">
      <div class="row">
        <ion-icon name="person-outline"></ion-icon>
        <span>{{ 'profile.my_account' | translate }}</span>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </div>
    </div>

    <div class="settings-group">
      <div class="row">
        <ion-icon name="cash-outline"></ion-icon>
        <span>{{ 'profile.currency' | translate }}</span>
        <span class="value">{{ profile.currency }}</span>
        <ion-icon name="chevron-forward-outline" class="chevron"></ion-icon>
      </div>

      <div class="row">
        <ion-icon name="moon-outline"></ion-icon>
        <span>{{ 'profile.dark_mode' | translate }}</span>
        <ion-toggle [checked]="darkMode" (ionChange)="onDarkModeChange($event)"></ion-toggle>
      </div>
    </div>

    <button class="logout-card" (click)="logout()">
      <ion-icon name="log-out-outline"></ion-icon>
      {{ 'profile.logout' | translate }}
    </button>
  </div>
</div>
